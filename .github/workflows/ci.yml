name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo checks
        run: node tools/check.mjs
      - name: Tests (browser tests skip without Playwright)
        run: node --test 'tests/*.test.mjs'
